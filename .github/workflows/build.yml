name: Build

permissions:
  contents: write

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        if: github.event_name != 'pull_request' || github.head_ref == 'codex/publish-v14-once'
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Prepare PR build output
        if: github.event_name == 'pull_request' && github.head_ref != 'codex/publish-v14-once'
        run: mkdir -p $GITHUB_WORKSPACE/builds

      - name: Clean old plugin builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugins
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew

          # JitPack occasionally has transient outages. Retry dependency resolution,
          # but never publish unless a complete real build succeeds.
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew --refresh-dependencies make makePluginsJson; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 20))
          done

          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Verify generated artifact integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "builds"
          plugin = root / "TPBBridge.cs3"
          manifest = root / "plugins.json"
          if not plugin.is_file() or plugin.stat().st_size <= 0:
              raise SystemExit("TPBBridge.cs3 missing or empty")
          if not manifest.is_file() or manifest.stat().st_size <= 0:
              raise SystemExit("plugins.json missing or empty")

          entries = json.loads(manifest.read_text(encoding="utf-8"))
          entry = next((x for x in entries if x.get("internalName") == "TPBBridge"), None)
          if entry is None:
              raise SystemExit("TPBBridge entry missing from plugins.json")

          actual_size = plugin.stat().st_size
          if int(entry.get("fileSize", -1)) != actual_size:
              raise SystemExit(f"fileSize mismatch: json={entry.get('fileSize')} actual={actual_size}")

          actual_hash = "sha256-" + hashlib.sha256(plugin.read_bytes()).hexdigest()
          if entry.get("fileHash") != actual_hash:
              raise SystemExit("fileHash mismatch for TPBBridge.cs3")

          if int(entry.get("version", 0)) < 1:
              raise SystemExit("invalid TPBBridge version in plugins.json")

          print(f"Artifact integrity OK: version={entry['version']} size={actual_size} hash={actual_hash}")
          PY

      - name: Public TPB protocol smoke test
        run: python3 $GITHUB_WORKSPACE/src/scripts/tpb_protocol_smoke.py

      - name: Publish builds branch
        if: github.event_name != 'pull_request' || github.head_ref == 'codex/publish-v14-once'
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if git diff --cached --quiet; then
            echo "No build changes to publish"
          else
            git commit --amend -m "Build $GITHUB_SHA"
            git push --force
          fi
